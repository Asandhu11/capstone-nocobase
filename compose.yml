# compose.yml
#
# This file starts two containers:
#   1. postgres  - the database NocoBase stores all of its data in
#   2. app       - the NocoBase server itself
#
# Run it with:  docker compose up
# See README.md for full instructions.

networks:
  nocobase:
    driver: bridge

services:
  # ---------------------------------------------------------------
  # The database. NocoBase needs a real database (not just a file)
  # to run in "full" mode. We use Postgres because that's what the
  # official NocoBase docs recommend.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: nocobase-postgres
    restart: always
    # NocoBase's change-tracking / collaboration features need logical
    # replication turned on, hence this extra command flag.
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: nocobase
      POSTGRES_DB: nocobase
    volumes:
      # Keeps the database's data on your computer, in a "storage" folder
      # next to this compose.yml, so your data survives container restarts.
      - ./storage/db/postgres:/var/lib/postgresql/data
    networks:
      - nocobase

  # ---------------------------------------------------------------
  # The NocoBase application server (includes the web UI + API).
  # "latest-full" bundles every plugin so nothing else needs installing.
  # ---------------------------------------------------------------
  app:
    image: nocobase/nocobase:latest-full
    container_name: nocobase-app
    restart: always
    depends_on:
      - postgres
    environment:
      # A random secret NocoBase uses to encrypt things like login
      # tokens. It can be any long random string. Already generated
      # for you below - you don't need to change it.
      - APP_KEY=1d542c38a36d5d8768c5de53aa69207f

      # Tell NocoBase to use the postgres container above as its database.
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nocobase
      - DB_USER=nocobase
      - DB_PASSWORD=nocobase

      - TZ=America/New_York
    volumes:
      # Keeps uploaded files / plugins on your computer so they survive
      # container restarts.
      - ./storage:/app/nocobase/storage
    ports:
      # <host port>:<container port>
      # NocoBase listens on port 80 inside the container; we expose it
      # on port 13000 on your computer so you can open it in a browser.
      - '13000:80'
    networks:
      - nocobase
