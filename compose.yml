services:
  postgres:
    image: postgres:16
    entrypoint: ["/bin/sh", "/prepare-postgres.sh"]
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: nocobase
      POSTGRES_DB: nocobase
    healthcheck:
      # TCP stays unavailable while the first-run SQL snapshot is restoring.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nocobase -d nocobase"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/prepare-postgres.sh:/prepare-postgres.sh:ro
      - ./seed/prototype.sql:/docker-entrypoint-initdb.d/01-prototype.sql:ro

  prototype-migrations:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nocobase
    volumes:
      - ./scripts/migrate-admin-email.sql:/migrate-admin-email.sql:ro
      - ./scripts/migrate-table-actions.sql:/migrate-table-actions.sql:ro
      - ./scripts/migrate-sprint3.sql:/migrate-sprint3.sql:ro
    command: ["psql", "-h", "postgres", "-U", "nocobase", "-d", "nocobase", "-v", "ON_ERROR_STOP=1", "-f", "/migrate-admin-email.sql", "-f", "/migrate-table-actions.sql", "-f", "/migrate-sprint3.sql"]

  app:
    # The exported page models were tested with this exact NocoBase image.
    image: nocobase/nocobase@sha256:df2d3e90eafa9a742163781761beba725f147d5d1ac0f722be03ff0da0cfbec1
    restart: unless-stopped
    depends_on:
      prototype-migrations:
        condition: service_completed_successfully
    environment:
      APP_KEY: "1d542c38a36d5d8768c5de53aa69207f"
      ENCRYPTION_FIELD_KEY: "5adcb2279fb94fc9be4f16e751f9a00a"
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: nocobase
      INIT_ROOT_EMAIL: admin@nocobase.com
      INIT_ROOT_PASSWORD: admin123
      INIT_ROOT_NICKNAME: Administrator
      TZ: America/New_York
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1/api/pm:listEnabled',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 60
    volumes:
      - ./storage:/app/nocobase/storage
      - ./seed/assets/logo-sheoaa.png:/app/nocobase/storage/uploads/logo-sheoaa.png:ro
    ports:
      - "0.0.0.0:${NOCOBASE_PORT:-13003}:80"
  
  # Sprint 4 end-2-end Selenium testing that starts only when you request the "e2e-test" profile
  selenium:
    profiles:
      - e2e-test
    image: selenium/standalone-chrome:latest
    shm_size: "2gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SE_SCREEN_WIDTH: "1440"
      SE_SCREEN_HEIGHT: "1000"
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_VNC_NO_PASSWORD: "1"
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:5900:5900"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://localhost:4444/status | grep -q '\"ready\": *true'"
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 60
    
  e2e-test:
    profiles: [e2e-test]
    build: ./e2e-test
    depends_on:
      app:
        condition: service_healthy
      selenium:
        condition: service_healthy
    environment:
      BASE_URL: http://host.docker.internal:13003
      SELLENIUM_URL: http://selenium:4444/wd/hub
      ARTIFACT_DIR: /artifacts
    volumes:
      - ./e2e-test:/tests:ro
      - ./e2e-test/artifacts:/artifacts
volumes:
  postgres_data:
