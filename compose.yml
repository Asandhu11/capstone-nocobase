services:
  postgres:
    image: postgres:16
    entrypoint: ["/bin/sh", "/prepare-postgres.sh"]
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: nocobase
      POSTGRES_DB: nocobase
    healthcheck:
      # TCP stays unavailable while the first-run SQL snapshot is restoring.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nocobase -d nocobase"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
      - ./scripts/prepare-postgres.sh:/prepare-postgres.sh:ro
      - ./seed/prototype.sql:/docker-entrypoint-initdb.d/01-prototype.sql:ro
    networks: [intranet]

  prototype-migrations:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nocobase
    volumes:
      - ./scripts/migrate-admin-email.sql:/migrate-admin-email.sql:ro
      - ./scripts/migrate-table-actions.sql:/migrate-table-actions.sql:ro
      - ./scripts/migrate-sprint3.sql:/migrate-sprint3.sql:ro
    networks: [intranet]
    command: ["psql", "-h", "postgres", "-U", "nocobase", "-d", "nocobase", "-v", "ON_ERROR_STOP=1", "-f", "/migrate-admin-email.sql", "-f", "/migrate-table-actions.sql", "-f", "/migrate-sprint3.sql"]

  app:
    # The exported page models were tested with this exact NocoBase image.
    image: nocobase/nocobase@sha256:df2d3e90eafa9a742163781761beba725f147d5d1ac0f722be03ff0da0cfbec1
    restart: unless-stopped
    depends_on:
      prototype-migrations:
        condition: service_completed_successfully
    environment:
      APP_KEY: "1d542c38a36d5d8768c5de53aa69207f"
      ENCRYPTION_FIELD_KEY: "5adcb2279fb94fc9be4f16e751f9a00a"
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: nocobase
      INIT_ROOT_EMAIL: admin@nocobase.com
      INIT_ROOT_PASSWORD: admin123
      INIT_ROOT_NICKNAME: Administrator
      TZ: America/New_York
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1/api/pm:listEnabled',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 60
    volumes:
      - ./storage:/app/nocobase/storage
      - ./seed/assets/logo-sheoaa.png:/app/nocobase/storage/uploads/logo-sheoaa.png:ro
    # No published port: NocoBase is reachable only through the proxy.
    networks: [intranet]

  # Sprint 5 (Ayoola): Caddy is the only way in. It sits in the DMZ (public address
  # 10.0.1.10) and on the intranet (10.0.2.10), and forwards to NocoBase. See proxy/Caddyfile.
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./storage/proxy/data:/data
      - ./storage/proxy/config:/config
    ports:
      # This computer plays the public internet: http://localhost:13005
      - "127.0.0.1:${CLICKER_PORT:-13005}:80"
    networks:
      public:
        ipv4_address: 10.0.1.10
      intranet:
        ipv4_address: 10.0.2.10
        aliases: [proxy.intranet.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/signin"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The office VPN server (WireGuard). Staff working from home connect to 10.0.1.20:51820
  # and get a route to the intranet only. It generates the "home" peer profile on first start.
  vpn:
    image: lscr.io/linuxserver/wireguard:1.0.20250521
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      SERVERURL: 10.0.1.20
      SERVERPORT: "51820"
      PEERS: home
      PEERDNS: auto
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 10.0.2.0/24
    volumes:
      - ./storage/vpn/server:/config
    networks:
      public:
        ipv4_address: 10.0.1.20
      intranet:
        ipv4_address: 10.0.2.20
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/peer_home/peer_home.conf && wg show wg0 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # A work-from-home computer: on the internet, connected to the office through the VPN.
  # Its browser requests for admin pages go to the proxy's intranet address, http://10.0.2.10.
  home:
    image: lscr.io/linuxserver/wireguard:1.0.20250521
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - ./storage/vpn/home:/config
      - ./storage/vpn/server/peer_home:/peer:ro
      - ./vpn/home-peer.sh:/custom-cont-init.d/10-home-peer:ro
    ports:
      # Optional: watch the home browser at http://localhost:7900 (profile "browser").
      - "127.0.0.1:${HOME_BROWSER_PORT:-7900}:7900"
    networks:
      public:
        ipv4_address: 10.0.1.30
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 latest-handshakes | awk '{exit !($$2 > 0)}' || ping -c1 -W2 10.0.2.10 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # An office computer on the intranet, used by scripts/verify-proxy.sh.
  office:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    command: ["sleep", "infinity"]
    networks:
      intranet:
        ipv4_address: 10.0.2.40

  # Optional real browser at the work-from-home computer. It shares the home computer's
  # network, so it reaches the admin pages through the VPN. Start with --profile browser,
  # open http://localhost:7900 (password: secret), and browse to http://10.0.2.10/admin/settings
  home-browser:
    image: selenium/standalone-chromium:4.51.0-20261010
    profiles: [browser]
    shm_size: 2gb
    network_mode: service:home
    depends_on:
      home:
        condition: service_healthy

networks:
  # The internet and the DMZ.
  public:
    ipam:
      config:
        - subnet: 10.0.1.0/24
  # The office intranet. internal: no route out, and no published ports land here.
  intranet:
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24
