services:
  postgres:
    image: postgres:16
    entrypoint: ["/bin/sh", "/prepare-postgres.sh"]
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: nocobase
      POSTGRES_DB: nocobase
    healthcheck:
      # TCP stays unavailable while the first-run SQL snapshot is restoring.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nocobase -d nocobase"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - ${CLICKER_STORAGE:-./storage}/db/postgres:/var/lib/postgresql/data
      - ./scripts/prepare-postgres.sh:/prepare-postgres.sh:ro
      - ./seed/prototype.sql:/docker-entrypoint-initdb.d/01-prototype.sql:ro

  prototype-migrations:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nocobase
    volumes:
      - ./scripts/migrate-admin-email.sql:/migrate-admin-email.sql:ro
      - ./scripts/migrate-table-actions.sql:/migrate-table-actions.sql:ro
      - ./scripts/migrate-sprint3.sql:/migrate-sprint3.sql:ro
    command: ["psql", "-h", "postgres", "-U", "nocobase", "-d", "nocobase", "-v", "ON_ERROR_STOP=1", "-f", "/migrate-admin-email.sql", "-f", "/migrate-table-actions.sql", "-f", "/migrate-sprint3.sql"]

  app:
    # The exported page models were tested with this exact NocoBase image.
    image: nocobase/nocobase@sha256:df2d3e90eafa9a742163781761beba725f147d5d1ac0f722be03ff0da0cfbec1
    restart: unless-stopped
    depends_on:
      prototype-migrations:
        condition: service_completed_successfully
    environment:
      APP_KEY: "1d542c38a36d5d8768c5de53aa69207f"
      ENCRYPTION_FIELD_KEY: "5adcb2279fb94fc9be4f16e751f9a00a"
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: nocobase
      INIT_ROOT_EMAIL: admin@nocobase.com
      INIT_ROOT_PASSWORD: admin123
      INIT_ROOT_NICKNAME: Administrator
      TZ: America/New_York
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1/api/pm:listEnabled',r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>{try{process.exit(r.statusCode===200&&Array.isArray(JSON.parse(b).data)?0:1)}catch{process.exit(1)}})}).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 60
    volumes:
      - ${CLICKER_STORAGE:-./storage}:/app/nocobase/storage
      - ./seed/assets/logo-sheoaa.png:/app/nocobase/storage/uploads/logo-sheoaa.png:ro
    ports:
      - "127.0.0.1:${NOCOBASE_PORT:-13004}:80"
    networks:
      default:
        aliases: [clicker.test]

  selenium:
    image: selenium/standalone-chromium:4.51.0-20261010
    profiles: [e2e]
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "180"
    healthcheck:
      # A busy single-session Grid can report ready=false; it is still healthy.
      test: ["CMD-SHELL", "curl -fsS --noproxy '*' http://127.0.0.1:4444/status | jq -e '.value.nodes | any(.availability == \"UP\")' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
    # Grid and browser-control ports stay on the Compose network.

  e2e:
    build: ./tests/e2e
    profiles: [e2e]
    depends_on:
      app:
        condition: service_healthy
      selenium:
        condition: service_healthy
    environment:
      # Chromium upgrades the bare name "app" to HTTPS; use a .test alias.
      CLICKER_TEST_URL: http://clicker.test
      SELENIUM_REMOTE_URL: http://selenium:4444
      E2E_ARTIFACTS: /artifacts
    volumes:
      - ./tests/e2e:/tests:ro
      - ${E2E_RESULTS:-./test-results}:/artifacts
    command: ["pytest", "-v", "--tb=short", "--junitxml=/artifacts/results.xml", "-p", "no:cacheprovider"]
