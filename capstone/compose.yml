name: nocobase

services:
  app:
    image: nocobase/nocobase:latest-full
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      admin-email:
        condition: service_completed_successfully
    environment:
      APP_KEY: "change-this-course-project-app-key-2026"
      ENCRYPTION_FIELD_KEY: "course-project-encryption-key-2026"
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: nocobase
      TZ: America/New_York
      INIT_ROOT_EMAIL: admin@nocobase.com
      INIT_ROOT_PASSWORD: admin123
      INIT_ROOT_NICKNAME: Administrator
    volumes:
      - ./storage:/app/nocobase/storage
    ports:
      - "127.0.0.1:13000:80"
    networks:
      - nocobase

  admin-email:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nocobase
    volumes:
      - ../scripts/migrate-admin-email.sql:/migrate-admin-email.sql:ro
    command: ["psql", "-h", "postgres", "-U", "nocobase", "-d", "nocobase", "-v", "ON_ERROR_STOP=1", "-f", "/migrate-admin-email.sql"]
    networks:
      - nocobase

  postgres:
    image: postgres:16
    entrypoint: ["/bin/sh", "/prepare-postgres.sh"]
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: nocobase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase -d nocobase"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
      - ../scripts/prepare-postgres.sh:/prepare-postgres.sh:ro
    networks:
      - nocobase

networks:
  nocobase:
    driver: bridge
