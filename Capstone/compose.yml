
networks:
  nocobase:
    driver: bridge

services:
  nocobase-app:
    image: nocobase/nocobase:latest
    container_name: nocobase_app
    restart: always
    ports:
      - "13000:80"
    depends_on:
      nocobase-db:
        condition: service_healthy
    environment:
      - APP_KEY=2EMehVx2q+K5RZkgn5VpTX5PfOxJkbKW5D9DbWFiOdo=
      - DB_DIALECT=postgres
      - DB_HOST=nocobase-db
      - DB_PORT=5432
      - DB_DATABASE=nocobase
      - DB_USER=nocobase
      - DB_PASSWORD=nocobase_secure_pass
      - TZ=UTC
    volumes:
      # Bind mount: stores application data and files locally on your host machine
      # Located at: ./data/nocobase-storage
      - ./data/nocobase-storage:/app/nocobase/storage

  nocobase-db:
    image: postgres:15-alpine
    container_name: nocobase_db
    restart: always
    environment:
      - POSTGRES_DB=nocobase
      - POSTGRES_USER=nocobase
      - POSTGRES_PASSWORD=nocobase_secure_pass
    volumes:
      # Bind mount: stores database files locally on your host machine
      # Located at: ./data/postgres-data
      - ./data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase -d nocobase"]
      interval: 10s
      timeout: 5s
      retries: 5
