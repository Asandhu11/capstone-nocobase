# HAProxy for Clicker (Sprint 5).
#
# HAProxy is the only service that touches the outside world. It has two "faces":
#
#   public face  port 8080, listens on every interface, published to the host.
#                Lets through only the public routes (sign-in, the attendant and
#                manager screens, the data calls those screens make) and refuses
#                everything that could change NocoBase's configuration.
#
#   admin face   port 8081, bound ONLY to the intranet address (10.77.2.10) and
#                never published to the host. Allows every route, but only for
#                clients on the intranet. The VPN gateway is on the intranet, so
#                people working from home reach this face through the VPN tunnel.
#
# Anything not explicitly allowed on the public face is refused (default deny
# for writes, allow-list for the few POST calls that the screens need).

global
    log stdout format raw local0
    maxconn 1000
    # "normalize-uri" is still marked experimental in HAProxy 2.8, so it must be allowed here.
    expose-experimental-directives

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-request 10s
    timeout tunnel  1h          # NocoBase keeps a websocket open at /ws

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 5s

backend nocobase
    # "app" is the NocoBase container on the intranet network.
    server app app:80 check resolvers docker init-addr last,libc,none

# --------------------------------------------------------------------------
# PUBLIC FACE
# --------------------------------------------------------------------------
frontend public
    bind :8080
    monitor-uri /__proxy_health

    # Tidy the path first so tricks like /admin/../admin//settings cannot
    # slip past the rules below. The backend sees the cleaned path too.
    # (Order matters: decode %2e first so an encoded ".." is seen as a real "..".)
    http-request normalize-uri percent-decode-unreserved
    http-request normalize-uri path-merge-slashes
    http-request normalize-uri path-strip-dotdot

    # --- what the public screens are allowed to do -------------------------
    acl is_api        path_beg /api/
    acl is_read       method GET HEAD

    # NocoBase screens that configure the system, plus the self sign-up pages.
    acl admin_screen  path_beg -i /admin/settings /signup /forgot-password /reset-password

    # API resources that expose configuration, users or plugins.
    # The few calls the shell needs on every page load are listed as exceptions.
    acl api_closed    path_beg -i /api/users /api/applicationPlugins /api/pm /api/roles /api/app: /api/authenticators /api/rolesUsers
    acl api_open      path -i -m str /api/pm:listEnabled /api/roles:check /api/app:getInfo /api/app:getLang /api/authenticators:publicList

    # The only API calls that change data and are allowed from outside:
    # sign in, sign out, and the two buttons on the attendant screens.
    acl is_post       method POST
    acl api_post_ok   path -m str /api/auth:signIn /api/auth:signOut /api/entryRecords:create /api/exitRecords:create

    # A header that asks the server to treat a GET as a POST would sidestep the method rules.
    acl method_override req.hdr(X-HTTP-Method-Override) -m found

    # Paths that still contain "/./", "/../", an encoded slash or backslash, a double
    # encoding, or a ";" after cleaning are never used by the screens. Refuse them so they
    # cannot be read differently by HAProxy and by NocoBase.
    acl odd_path      path_sub -i /./ /../ %2f %5c %25 ;
    acl odd_path      path_end /. /..

    http-response set-header X-Proxy-Face public

    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: unusual path.\n" if odd_path
    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: method override is not allowed.\n" if method_override
    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: admin screens are only available from the intranet or the VPN.\n" if admin_screen
    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: this API resource is only available from the intranet or the VPN.\n" if is_api api_closed !api_open
    http-request allow if is_api is_post api_post_ok
    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: changing data or configuration is only available from the intranet or the VPN.\n" if is_api !is_read
    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: only GET requests are allowed here.\n" if !is_api !is_read

    default_backend nocobase

# --------------------------------------------------------------------------
# ADMIN FACE (intranet and VPN only)
# --------------------------------------------------------------------------
frontend admin
    bind 10.77.2.10:8081

    # 10.77.2.0/24 is the office intranet. It includes the VPN gateway (10.77.2.20),
    # which is where connections that arrive through the VPN tunnel come out.
    acl from_intranet src 10.77.2.0/24

    http-response set-header X-Proxy-Face admin
    http-request return status 403 content-type text/plain lf-string "Blocked by HAProxy: the admin face only accepts the intranet and the VPN.\n" if !from_intranet

    default_backend nocobase
